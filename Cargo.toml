[package]
name = "ross-fisheye"
version = "0.1.0"
edition = "2021"
description = "A fisheye magnifier for Wayland, based on woomer"
license = "MIT"
repository = "https://github.com/rossmelabasto/ross_fisheye"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1"
image = "0.24.9"
libwayshot = { git = "https://github.com/waycrate/wayshot", branch = "freeze-feat-andreas" }
raylib = { version = "5.0.1", features = ["wayland", "opengl_33"] }
[features]
dev = []
[profile.release]
strip = true
lto = true
